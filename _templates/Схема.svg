<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="sans-serif" font-size="13">
  <!-- Палитра хранилища:
       #8a8a8a  нейтральный текст, стрелки, пояснения (читается в обеих темах)
       #4a90d9  первая сущность / «было»
       #6aa84f  вторая сущность / «стало», «хорошо»
       #d97a4a  акцент, то, о чём речь, «внимание»
       Фон не заливаем, чёрный и белый не используем. -->

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">Заголовок схемы: что она показывает</text>

  <!-- блок без заливки: второстепенная сущность -->
  <rect x="40" y="60" width="200" height="90" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="52" y="84" fill="#4a90d9" font-size="15" font-weight="bold">заголовок блока</text>
  <text x="52" y="106" fill="#8a8a8a" font-size="12">строка содержимого</text>
  <text x="52" y="126" fill="#8a8a8a" font-size="12">ещё строка</text>

  <!-- блок с заливкой: то, о чём речь -->
  <rect x="300" y="60" width="200" height="90" rx="6" fill="#d97a4a" fill-opacity="0.12" stroke="#d97a4a" stroke-width="2"/>
  <text x="312" y="84" fill="#d97a4a" font-size="15" font-weight="bold">акцентный блок</text>
  <text x="312" y="106" fill="#8a8a8a" font-size="12">строка содержимого</text>

  <rect x="560" y="60" width="200" height="90" rx="6" fill="#6aa84f" fill-opacity="0.12" stroke="#6aa84f" stroke-width="2"/>
  <text x="572" y="84" fill="#6aa84f" font-size="15" font-weight="bold">результат</text>
  <text x="572" y="106" fill="#8a8a8a" font-size="12">строка содержимого</text>

  <line x1="240" y1="105" x2="294" y2="105" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="105" x2="554" y2="105" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>

  <text x="40" y="210" fill="#8a8a8a" font-size="13">Пояснение под схемой: вывод, который читатель должен унести.</text>
  <text x="40" y="231" fill="#8a8a8a" font-size="13">Вторая строка пояснения, если нужна.</text>
</svg>
