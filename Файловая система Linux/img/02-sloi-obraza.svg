<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="b-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14171a"/>
    </marker>
    <marker id="b-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c5fd6"/>
    </marker>
  </defs>

  <rect width="900" height="410" fill="#ffffff"/>
  <text x="40" y="38" font-size="17" font-weight="600" fill="#14171a">Образ — стопка нижних слоёв. Контейнер — свой верхний.</text>

  <!-- Dockerfile -->
  <text x="40" y="76" font-size="12" fill="#626b78">Dockerfile</text>
  <rect x="40" y="86" width="260" height="200" fill="#f8f9fa" stroke="#c9ced6" rx="3"/>
  <text x="56" y="118" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FROM ubuntu:24.04</text>
  <text x="56" y="158" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">RUN apt install ...</text>
  <text x="56" y="198" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">COPY gallery /app/</text>
  <text x="56" y="238" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">RUN rm -rf .../lists</text>

  <line x1="308" y1="186" x2="390" y2="186" stroke="#14171a" stroke-width="1.4" marker-end="url(#b-ink)"/>
  <text x="349" y="176" font-size="11" fill="#626b78" text-anchor="middle">docker build</text>

  <!-- container uppers -->
  <rect x="400" y="60" width="140" height="58" fill="#eef3fd" stroke="#1c5fd6" stroke-width="1.2" rx="3"/>
  <text x="412" y="82" font-size="12" fill="#1c5fd6">gallery-1</text>
  <text x="412" y="100" font-size="11" fill="#626b78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">upperdir, rw</text>

  <rect x="550" y="60" width="140" height="58" fill="#eef3fd" stroke="#1c5fd6" stroke-width="1.2" rx="3"/>
  <text x="562" y="82" font-size="12" fill="#1c5fd6">gallery-2</text>
  <text x="562" y="100" font-size="11" fill="#626b78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">upperdir, rw</text>

  <line x1="470" y1="118" x2="470" y2="136" stroke="#1c5fd6" stroke-width="1.4" marker-end="url(#b-blue)"/>
  <line x1="620" y1="118" x2="620" y2="136" stroke="#1c5fd6" stroke-width="1.4" marker-end="url(#b-blue)"/>

  <!-- image layers, later on top -->
  <rect x="400" y="140" width="290" height="44" fill="#f2f3f5" stroke="#c9ced6" rx="2"/>
  <text x="412" y="160" font-size="11" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">RUN rm -rf .../lists</text>
  <text x="412" y="175" font-size="10" fill="#b03030">внутри слоя только whiteout</text>

  <rect x="400" y="190" width="290" height="44" fill="#f2f3f5" stroke="#c9ced6" rx="2"/>
  <text x="412" y="210" font-size="11" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">COPY gallery /app/</text>

  <rect x="400" y="240" width="290" height="44" fill="#f2f3f5" stroke="#c9ced6" rx="2"/>
  <text x="412" y="260" font-size="11" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">RUN apt install ...</text>
  <text x="412" y="275" font-size="10" fill="#626b78">пакеты и списки apt лежат здесь</text>

  <rect x="400" y="290" width="290" height="44" fill="#f2f3f5" stroke="#c9ced6" rx="2"/>
  <text x="412" y="316" font-size="11" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FROM ubuntu:24.04</text>

  <text x="400" y="356" font-size="12" fill="#626b78">слои образа — только чтение, у обоих контейнеров общие</text>

  <!-- notes -->
  <line x1="712" y1="60" x2="712" y2="356" stroke="#e4e7eb" stroke-width="1"/>
  <text x="730" y="76" font-size="11" fill="#14171a">Нижние слои общие:</text>
  <text x="730" y="93" font-size="11" fill="#14171a">десять контейнеров из</text>
  <text x="730" y="110" font-size="11" fill="#14171a">одного образа не займут</text>
  <text x="730" y="127" font-size="11" fill="#14171a">в десять раз больше места.</text>

  <text x="730" y="200" font-size="11" fill="#14171a">Верхний слой у каждого</text>
  <text x="730" y="217" font-size="11" fill="#14171a">свой, и docker rm удаляет</text>
  <text x="730" y="234" font-size="11" fill="#14171a">именно его.</text>

  <text x="730" y="290" font-size="11" fill="#b03030">RUN rm отдельной строкой</text>
  <text x="730" y="307" font-size="11" fill="#b03030">не уменьшает образ: файл</text>
  <text x="730" y="324" font-size="11" fill="#b03030">остался в слое ниже.</text>
</svg>
