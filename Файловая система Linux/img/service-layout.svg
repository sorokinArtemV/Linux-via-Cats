<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">Куда кладётся сервис gallery — и какая директива systemd это создаёт</text>

  <!-- заголовки колонок -->
  <text x="40" y="60" fill="#8a8a8a" font-size="12" font-weight="bold">что</text>
  <text x="230" y="60" fill="#8a8a8a" font-size="12" font-weight="bold">куда</text>
  <text x="470" y="60" fill="#8a8a8a" font-size="12" font-weight="bold">в unit-файле</text>
  <text x="650" y="60" fill="#8a8a8a" font-size="12" font-weight="bold">переживает reboot</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#8a8a8a" stroke-width="1"/>

  <!-- строки -->
  <g font-size="13">
    <text x="40" y="94" fill="#4a90d9">программа</text>
    <text x="230" y="94" fill="#4a90d9" font-family="monospace">/opt/gallery/</text>
    <text x="470" y="94" fill="#8a8a8a" font-size="12">ExecStart=/opt/gallery/bin/gallery</text>
    <text x="650" y="94" fill="#8a8a8a">да</text>

    <text x="40" y="124" fill="#d97a4a">конфиг</text>
    <text x="230" y="124" fill="#d97a4a" font-family="monospace">/etc/gallery/</text>
    <text x="470" y="124" fill="#8a8a8a" font-size="12">ConfigurationDirectory=gallery</text>
    <text x="650" y="124" fill="#8a8a8a">да, бэкапить</text>

    <text x="40" y="154" fill="#6aa84f">состояние (БД, индекс)</text>
    <text x="230" y="154" fill="#6aa84f" font-family="monospace">/var/lib/gallery/</text>
    <text x="470" y="154" fill="#8a8a8a" font-size="12">StateDirectory=gallery</text>
    <text x="650" y="154" fill="#8a8a8a">да, бэкапить</text>

    <text x="40" y="184" fill="#6aa84f">логи</text>
    <text x="230" y="184" fill="#6aa84f" font-family="monospace">/var/log/gallery/</text>
    <text x="470" y="184" fill="#8a8a8a" font-size="12">LogsDirectory=gallery</text>
    <text x="650" y="184" fill="#8a8a8a">да, ротировать</text>

    <text x="40" y="214" fill="#6aa84f">кэш миниатюр</text>
    <text x="230" y="214" fill="#6aa84f" font-family="monospace">/var/cache/gallery/</text>
    <text x="470" y="214" fill="#8a8a8a" font-size="12">CacheDirectory=gallery</text>
    <text x="650" y="214" fill="#8a8a8a">да, можно удалять</text>

    <text x="40" y="244" fill="#888">сокет, pid-файл</text>
    <text x="230" y="244" fill="#888" font-family="monospace">/run/gallery/</text>
    <text x="470" y="244" fill="#8a8a8a" font-size="12">RuntimeDirectory=gallery</text>
    <text x="650" y="244" fill="#d97a4a">нет — tmpfs</text>

    <text x="40" y="274" fill="#6aa84f">сами фотографии</text>
    <text x="230" y="274" fill="#6aa84f" font-family="monospace">/srv/cats/</text>
    <text x="470" y="274" fill="#8a8a8a" font-size="12">ReadWritePaths=/srv/cats</text>
    <text x="650" y="274" fill="#8a8a8a">да, главный бэкап</text>
  </g>

  <line x1="40" y1="292" x2="760" y2="292" stroke="#8a8a8a" stroke-width="1"/>
  <text x="40" y="318" fill="#8a8a8a" font-size="12">Директивы *Directory= сами создают каталог с правами пользователя сервиса и кладут путь</text>
  <text x="40" y="336" fill="#8a8a8a" font-size="12">в переменные окружения STATE_DIRECTORY, LOGS_DIRECTORY, RUNTIME_DIRECTORY и т.д.</text>
  <text x="40" y="362" fill="#d97a4a" font-size="12">Единственное, чего здесь нет: записи в /usr и /opt во время работы.</text>
</svg>
