<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="c-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d95a1"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#ffffff"/>
  <text x="40" y="38" font-size="17" font-weight="600" fill="#14171a">Куда на самом деле уходит запись из контейнера</text>

  <text x="40" y="72" font-size="11" fill="#626b78">путь внутри контейнера</text>
  <text x="300" y="72" font-size="11" fill="#626b78">что за ним на хосте</text>
  <text x="712" y="72" font-size="11" fill="#626b78">судьба</text>
  <line x1="40" y1="80" x2="862" y2="80" stroke="#e4e7eb" stroke-width="1"/>

  <!-- row 1 -->
  <rect x="40" y="90" width="240" height="48" fill="#eef3fd" stroke="#1c5fd6" rx="2"/>
  <text x="52" y="112" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/app/uploads, /etc, /usr</text>
  <text x="52" y="128" font-size="10" fill="#626b78">всё, за чем нет монтирования</text>
  <line x1="286" y1="114" x2="298" y2="114" stroke="#8d95a1" stroke-width="1.2" marker-end="url(#c-ink)"/>
  <rect x="300" y="90" width="390" height="48" fill="#f8f9fa" stroke="#c9ced6" rx="2"/>
  <text x="312" y="112" font-size="11" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/var/lib/docker/overlay2/&lt;id&gt;/diff</text>
  <text x="312" y="128" font-size="10" fill="#626b78">верхний слой overlay</text>
  <rect x="712" y="100" width="150" height="28" fill="#fdecec" rx="3"/>
  <text x="787" y="119" font-size="11" fill="#b03030" text-anchor="middle">исчезнет при docker rm</text>

  <!-- row 2 -->
  <rect x="40" y="158" width="240" height="48" fill="#ffffff" stroke="#c9ced6" rx="2"/>
  <text x="52" y="180" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/data</text>
  <text x="52" y="196" font-size="10" fill="#626b78">bind mount, -v /srv/cats:/data</text>
  <line x1="286" y1="182" x2="298" y2="182" stroke="#8d95a1" stroke-width="1.2" marker-end="url(#c-ink)"/>
  <rect x="300" y="158" width="390" height="48" fill="#f8f9fa" stroke="#c9ced6" rx="2"/>
  <text x="312" y="180" font-size="11" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/srv/cats на /dev/sdb1</text>
  <text x="312" y="196" font-size="10" fill="#626b78">обычные файлы хоста, обычные inode</text>
  <rect x="712" y="168" width="150" height="28" fill="#e8f5ee" rx="3"/>
  <text x="787" y="187" font-size="11" fill="#1e7a4d" text-anchor="middle">переживёт всё</text>

  <!-- row 3 -->
  <rect x="40" y="226" width="240" height="48" fill="#ffffff" stroke="#c9ced6" rx="2"/>
  <text x="52" y="248" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/var/lib/db</text>
  <text x="52" y="264" font-size="10" fill="#626b78">named volume</text>
  <line x1="286" y1="250" x2="298" y2="250" stroke="#8d95a1" stroke-width="1.2" marker-end="url(#c-ink)"/>
  <rect x="300" y="226" width="390" height="48" fill="#f8f9fa" stroke="#c9ced6" rx="2"/>
  <text x="312" y="248" font-size="11" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/var/lib/docker/volumes/gallery-db/_data</text>
  <text x="312" y="264" font-size="10" fill="#626b78">физически тот же bind mount</text>
  <rect x="712" y="236" width="150" height="28" fill="#e8f5ee" rx="3"/>
  <text x="787" y="255" font-size="11" fill="#1e7a4d" text-anchor="middle">переживёт docker rm</text>

  <!-- row 4 -->
  <rect x="40" y="294" width="240" height="48" fill="#ffffff" stroke="#c9ced6" rx="2"/>
  <text x="52" y="316" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/tmp</text>
  <text x="52" y="332" font-size="10" fill="#626b78">tmpfs</text>
  <line x1="286" y1="318" x2="298" y2="318" stroke="#8d95a1" stroke-width="1.2" marker-end="url(#c-ink)"/>
  <rect x="300" y="294" width="390" height="48" fill="#f8f9fa" stroke="#c9ced6" rx="2"/>
  <text x="312" y="316" font-size="11" fill="#14171a">оперативная память хоста</text>
  <text x="312" y="332" font-size="10" fill="#626b78">и, при нехватке, swap</text>
  <rect x="712" y="304" width="150" height="28" fill="#fdecec" rx="3"/>
  <text x="787" y="323" font-size="11" fill="#b03030" text-anchor="middle">исчезнет при stop</text>

  <!-- row 5 -->
  <rect x="40" y="362" width="240" height="48" fill="#ffffff" stroke="#c9ced6" rx="2"/>
  <text x="52" y="384" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/etc/hosts, resolv.conf</text>
  <text x="52" y="400" font-size="10" fill="#626b78">bind mount поверх overlay</text>
  <line x1="286" y1="386" x2="298" y2="386" stroke="#8d95a1" stroke-width="1.2" marker-end="url(#c-ink)"/>
  <rect x="300" y="362" width="390" height="48" fill="#f8f9fa" stroke="#c9ced6" rx="2"/>
  <text x="312" y="384" font-size="11" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/var/lib/docker/containers/&lt;id&gt;/hosts</text>
  <text x="312" y="400" font-size="10" fill="#626b78">Docker создаёт заново при каждом запуске</text>
  <rect x="712" y="372" width="150" height="28" fill="#f2f3f5" rx="3"/>
  <text x="787" y="391" font-size="11" fill="#626b78" text-anchor="middle">в образе править бесполезно</text>

  <!-- row 6 -->
  <rect x="40" y="430" width="240" height="48" fill="#ffffff" stroke="#c9ced6" rx="2"/>
  <text x="52" y="452" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">stdout</text>
  <text x="52" y="468" font-size="10" fill="#626b78">не путь, а поток</text>
  <line x1="286" y1="454" x2="298" y2="454" stroke="#8d95a1" stroke-width="1.2" marker-end="url(#c-ink)"/>
  <rect x="300" y="430" width="390" height="48" fill="#f8f9fa" stroke="#c9ced6" rx="2"/>
  <text x="312" y="452" font-size="11" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/var/lib/docker/containers/&lt;id&gt;/*-json.log</text>
  <text x="312" y="468" font-size="10" fill="#626b78">Docker перехватывает поток и пишет в файл</text>
  <rect x="712" y="440" width="150" height="28" fill="#fdf3e3" rx="3"/>
  <text x="787" y="459" font-size="11" fill="#9a6300" text-anchor="middle">растёт без ротации</text>

  <line x1="40" y1="502" x2="862" y2="502" stroke="#e4e7eb" stroke-width="1"/>
  <text x="40" y="524" font-size="12" fill="#14171a">Всё, кроме /tmp, — обычные файлы на дисках хоста.</text>
  <text x="40" y="542" font-size="12" fill="#14171a">Контейнер меняет не хранение данных, а то, какие пути к ним ведут.</text>
</svg>
