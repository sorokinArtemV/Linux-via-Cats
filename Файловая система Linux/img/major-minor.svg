<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">Файл устройства: вместо блоков данных — два числа</text>

  <!-- строка ls -->
  <rect x="40" y="46" width="330" height="40" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="52" y="71" fill="#4a90d9" font-family="monospace" font-size="13">brw-rw----  root disk  8, 2  /dev/sda2</text>

  <!-- inode -->
  <rect x="40" y="120" width="200" height="90" rx="6" fill="#d97a4a" fill-opacity="0.15" stroke="#d97a4a" stroke-width="2"/>
  <text x="52" y="142" fill="#d97a4a" font-weight="bold">inode в /dev</text>
  <text x="52" y="162" fill="#8a8a8a" font-size="12">тип: блочное устройство</text>
  <text x="52" y="180" fill="#8a8a8a" font-size="12">major: 8   minor: 2</text>
  <text x="52" y="198" fill="#8a8a8a" font-size="12">блоков данных: нет</text>
  <line x1="140" y1="86" x2="140" y2="114" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- major -> driver -->
  <line x1="240" y1="150" x2="314" y2="150" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="248" y="142" fill="#8a8a8a" font-size="11">major 8</text>
  <rect x="320" y="120" width="180" height="60" rx="6" fill="none" stroke="#6aa84f" stroke-width="2"/>
  <text x="332" y="142" fill="#6aa84f" font-weight="bold">драйвер sd</text>
  <text x="332" y="162" fill="#8a8a8a" font-size="12">SATA / SCSI / USB-диски</text>

  <!-- minor -> instance -->
  <line x1="500" y1="150" x2="574" y2="150" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="508" y="142" fill="#8a8a8a" font-size="11">minor 2</text>
  <rect x="580" y="100" width="180" height="120" rx="6" fill="none" stroke="#6aa84f" stroke-width="2"/>
  <text x="592" y="122" fill="#8a8a8a" font-size="12">minor 0 → sda, весь диск</text>
  <text x="592" y="142" fill="#8a8a8a" font-size="12">minor 1 → sda1</text>
  <text x="592" y="162" fill="#6aa84f" font-weight="bold">minor 2 → sda2</text>
  <text x="592" y="182" fill="#8a8a8a" font-size="12">minor 16 → sdb, второй диск</text>
  <text x="592" y="202" fill="#8a8a8a" font-size="12">minor 17 → sdb1 …</text>

  <text x="40" y="250" fill="#8a8a8a" font-size="13">Major выбирает драйвер, minor — конкретное устройство у этого драйвера.</text>
  <text x="40" y="270" fill="#8a8a8a" font-size="13">Имя «sda2» — просто удобная подпись, которую udev вешает на пару (8, 2).</text>
  <text x="40" y="300" fill="#d97a4a" font-size="13">Символьные устройства устроены так же: /dev/null — это (1, 3), /dev/urandom — (1, 9).</text>
</svg>
