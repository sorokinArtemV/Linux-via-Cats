<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97a4a"/>
    </marker>
  </defs>

  <!-- Левая половина: hardlink -->
  <text x="40" y="26" fill="#4a90d9" font-size="15" font-weight="bold">Жёсткая ссылка</text>
  <text x="40" y="44" fill="#8a8a8a" font-size="12">два имени, один inode, счётчик Links: 2</text>

  <rect x="40" y="70" width="150" height="34" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="52" y="92" fill="#4a90d9">2024/murzik.jpg</text>
  <rect x="40" y="150" width="150" height="34" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="52" y="172" fill="#4a90d9">best/murzik.jpg</text>
  <text x="40" y="206" fill="#8a8a8a" font-size="12">обе — строки в таблицах каталогов</text>

  <line x1="190" y1="87" x2="254" y2="115" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="190" y1="167" x2="254" y2="139" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="260" y="98" width="120" height="58" rx="6" fill="#d97a4a" fill-opacity="0.15" stroke="#d97a4a" stroke-width="2"/>
  <text x="272" y="120" fill="#d97a4a" font-weight="bold">inode 1310726</text>
  <text x="272" y="140" fill="#d97a4a">Links: 2</text>

  <text x="40" y="250" fill="#8a8a8a" font-size="12">Нет «оригинала» и «копии»: оба имени равноправны.</text>
  <text x="40" y="268" fill="#8a8a8a" font-size="12">rm одного имени → Links: 1, данные на месте.</text>

  <!-- Разделитель -->
  <line x1="410" y1="20" x2="410" y2="300" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Правая половина: symlink -->
  <text x="440" y="26" fill="#6aa84f" font-size="15" font-weight="bold">Символическая ссылка</text>
  <text x="440" y="44" fill="#8a8a8a" font-size="12">отдельный файл, внутри — строка пути</text>

  <rect x="440" y="70" width="140" height="34" rx="6" fill="none" stroke="#6aa84f" stroke-width="2"/>
  <text x="452" y="92" fill="#6aa84f">latest.jpg</text>
  <line x1="580" y1="87" x2="614" y2="87" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="620" y="60" width="150" height="54" rx="6" fill="#6aa84f" fill-opacity="0.15" stroke="#6aa84f" stroke-width="2"/>
  <text x="632" y="80" fill="#6aa84f" font-weight="bold">inode 1310740</text>
  <text x="632" y="100" fill="#6aa84f" font-size="12">"2024/murzik.jpg"</text>

  <line x1="695" y1="114" x2="695" y2="146" stroke="#d97a4a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrO)"/>
  <text x="705" y="134" fill="#d97a4a" font-size="12">ядро идёт по пути</text>

  <rect x="620" y="152" width="150" height="34" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="632" y="174" fill="#4a90d9">2024/murzik.jpg</text>
  <line x1="695" y1="186" x2="695" y2="218" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="620" y="224" width="150" height="40" rx="6" fill="#d97a4a" fill-opacity="0.15" stroke="#d97a4a" stroke-width="2"/>
  <text x="632" y="249" fill="#d97a4a" font-weight="bold">inode 1310726</text>

  <text x="440" y="292" fill="#8a8a8a" font-size="12">Счётчик 1310726 не меняется. Если 2024/murzik.jpg</text>
  <text x="440" y="310" fill="#8a8a8a" font-size="12">переименовать — ссылка останется, но станет «битой».</text>

  <text x="40" y="340" fill="#8a8a8a" font-size="12">Жёсткая ссылка привязана к inode. Символическая — к имени.</text>
</svg>
