<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">Дерево монтирований catbox: одно дерево имён, шесть файловых систем</text>

  <!-- корень -->
  <rect x="300" y="46" width="200" height="44" rx="6" fill="#4a90d9" fill-opacity="0.15" stroke="#4a90d9" stroke-width="2"/>
  <text x="312" y="64" fill="#4a90d9" font-weight="bold">/</text>
  <text x="312" y="82" fill="#8a8a8a" font-size="12">/dev/sda2, ext4</text>

  <!-- ветки -->
  <line x1="400" y1="90" x2="400" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="90" y1="120" x2="710" y2="120" stroke="#8a8a8a" stroke-width="1.5"/>
  <line x1="90" y1="120" x2="90" y2="146" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="245" y1="120" x2="245" y2="146" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="120" x2="400" y2="146" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="555" y1="120" x2="555" y2="146" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="710" y1="120" x2="710" y2="146" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- /proc -->
  <rect x="30" y="152" width="120" height="50" rx="6" fill="none" stroke="#888" stroke-width="2"/>
  <text x="40" y="172" fill="#8a8a8a" font-weight="bold">/proc</text>
  <text x="40" y="190" fill="#8a8a8a" font-size="12">proc, в памяти</text>

  <!-- /run -->
  <rect x="185" y="152" width="120" height="50" rx="6" fill="none" stroke="#888" stroke-width="2"/>
  <text x="195" y="172" fill="#8a8a8a" font-weight="bold">/run</text>
  <text x="195" y="190" fill="#8a8a8a" font-size="12">tmpfs, в памяти</text>

  <!-- /boot/efi -->
  <rect x="340" y="152" width="120" height="50" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="350" y="172" fill="#4a90d9" font-weight="bold">/boot/efi</text>
  <text x="350" y="190" fill="#8a8a8a" font-size="12">/dev/sda1, vfat</text>

  <!-- /srv/cats -->
  <rect x="495" y="152" width="120" height="50" rx="6" fill="#6aa84f" fill-opacity="0.15" stroke="#6aa84f" stroke-width="2"/>
  <text x="505" y="172" fill="#6aa84f" font-weight="bold">/srv/cats</text>
  <text x="505" y="190" fill="#8a8a8a" font-size="12">/dev/sdb1, ext4</text>

  <!-- /mnt/nas -->
  <rect x="650" y="152" width="120" height="50" rx="6" fill="none" stroke="#d97a4a" stroke-width="2"/>
  <text x="660" y="172" fill="#d97a4a" font-weight="bold">/mnt/nas</text>
  <text x="660" y="190" fill="#8a8a8a" font-size="12">nas:/photos, nfs</text>

  <!-- bind под /srv/cats -->
  <line x1="555" y1="202" x2="555" y2="240" stroke="#6aa84f" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <rect x="470" y="246" width="170" height="50" rx="6" fill="none" stroke="#6aa84f" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="480" y="266" fill="#6aa84f" font-weight="bold">/var/www/cats</text>
  <text x="480" y="284" fill="#8a8a8a" font-size="12">bind: /dev/sdb1[/2024]</text>
  <text x="655" y="266" fill="#8a8a8a" font-size="12">те же inode,</text>
  <text x="655" y="282" fill="#8a8a8a" font-size="12">второе окно</text>

  <text x="40" y="330" fill="#8a8a8a" font-size="12">Каталог /srv/cats на sda2 существует, но пока на нём что-то смонтировано, его собственное содержимое не видно.</text>
  <text x="40" y="350" fill="#8a8a8a" font-size="12">Именно там прячутся файлы, записанные «мимо» диска. findmnt показывает это дерево целиком.</text>
</svg>
