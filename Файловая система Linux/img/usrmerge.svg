<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">usrmerge: было и стало</text>

  <!-- ДО -->
  <text x="40" y="60" fill="#d97a4a" font-size="14" font-weight="bold">до (1971 – ~2015)</text>
  <text x="40" y="82" fill="#8a8a8a" font-size="12">два корневых диска PDP-11</text>
  <rect x="40" y="96" width="150" height="150" rx="6" fill="none" stroke="#d97a4a" stroke-width="2"/>
  <text x="52" y="116" fill="#d97a4a" font-weight="bold">/  (первый диск)</text>
  <text x="52" y="138" fill="#8a8a8a" font-size="12">/bin   — чтобы</text>
  <text x="52" y="156" fill="#8a8a8a" font-size="12">/sbin  — загрузиться</text>
  <text x="52" y="174" fill="#8a8a8a" font-size="12">/lib   — без /usr</text>
  <text x="52" y="196" fill="#8a8a8a" font-size="12">/etc</text>

  <rect x="210" y="96" width="150" height="150" rx="6" fill="none" stroke="#d97a4a" stroke-width="2"/>
  <text x="222" y="116" fill="#d97a4a" font-weight="bold">/usr  (второй диск)</text>
  <text x="222" y="138" fill="#8a8a8a" font-size="12">/usr/bin — всё</text>
  <text x="222" y="156" fill="#8a8a8a" font-size="12">/usr/sbin   остальное,</text>
  <text x="222" y="174" fill="#8a8a8a" font-size="12">/usr/lib    что не влезло</text>
  <text x="222" y="196" fill="#8a8a8a" font-size="12">/usr/share</text>
  <text x="40" y="270" fill="#8a8a8a" font-size="12">Граница «нужно для загрузки / не нужно» давно</text>
  <text x="40" y="286" fill="#8a8a8a" font-size="12">не соблюдалась: initramfs монтирует /usr сам.</text>

  <line x1="380" y1="170" x2="424" y2="170" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ПОСЛЕ -->
  <text x="440" y="60" fill="#6aa84f" font-size="14" font-weight="bold">после (Ubuntu 24.04, RHEL 9)</text>
  <text x="440" y="82" fill="#8a8a8a" font-size="12">вся ОС в одном дереве</text>
  <rect x="440" y="96" width="320" height="150" rx="6" fill="none" stroke="#6aa84f" stroke-width="2"/>
  <text x="452" y="116" fill="#6aa84f" font-weight="bold">/usr — единственное место с бинарниками</text>
  <text x="452" y="140" fill="#8a8a8a" font-size="12" font-family="monospace">/bin   -> usr/bin</text>
  <text x="452" y="158" fill="#8a8a8a" font-size="12" font-family="monospace">/sbin  -> usr/sbin</text>
  <text x="452" y="176" fill="#8a8a8a" font-size="12" font-family="monospace">/lib   -> usr/lib</text>
  <text x="452" y="194" fill="#8a8a8a" font-size="12" font-family="monospace">/lib64 -> usr/lib64</text>
  <text x="452" y="220" fill="#6aa84f" font-size="12">симлинки оставлены ради старых скриптов и #!/bin/sh</text>
  <text x="440" y="270" fill="#8a8a8a" font-size="12">Зачем: /usr можно снять снапшотом, смонтировать read-only,</text>
  <text x="440" y="286" fill="#8a8a8a" font-size="12">подменить целиком (образы, ostree) — не трогая /etc и /var.</text>
</svg>
