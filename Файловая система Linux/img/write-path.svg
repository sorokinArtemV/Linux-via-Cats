<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97a4a"/>
    </marker>
  </defs>
  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">Путь данных от write() до диска</text>

  <!-- процесс -->
  <rect x="40" y="60" width="160" height="60" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="52" y="84" fill="#4a90d9" font-weight="bold">cp murzik.jpg …</text>
  <text x="52" y="104" fill="#8a8a8a" font-size="12">write(fd, buf, 3 МБ)</text>

  <line x1="200" y1="90" x2="254" y2="90" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="206" y="80" fill="#8a8a8a" font-size="11">копия в память</text>

  <!-- page cache -->
  <rect x="260" y="46" width="280" height="90" rx="8" fill="#d97a4a" fill-opacity="0.15" stroke="#d97a4a" stroke-width="2"/>
  <text x="272" y="70" fill="#d97a4a" font-weight="bold">page cache (RAM)</text>
  <text x="272" y="90" fill="#8a8a8a" font-size="12">страницы помечены dirty</text>
  <text x="272" y="108" fill="#8a8a8a" font-size="12">видны в /proc/meminfo как Dirty:</text>
  <text x="272" y="126" fill="#8a8a8a" font-size="12">любой read() уже видит новые данные</text>

  <!-- возврат -->
  <path d="M 260 120 L 230 120 L 230 150 L 60 150" fill="none" stroke="#6aa84f" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="62" y="168" fill="#6aa84f" font-size="12">write() вернул управление — cp «закончил».</text>
  <text x="62" y="184" fill="#6aa84f" font-size="12">На диске ещё ничего нет.</text>

  <!-- writeback -->
  <line x1="400" y1="136" x2="400" y2="204" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="410" y="160" fill="#8a8a8a" font-size="12">writeback — кто раньше:</text>
  <text x="410" y="176" fill="#8a8a8a" font-size="12">• прошло ~30 с (dirty_expire)</text>
  <text x="410" y="192" fill="#8a8a8a" font-size="12">• dirty-страниц слишком много</text>
  <text x="560" y="160" fill="#d97a4a" font-size="12">• fsync() / sync / umount</text>
  <text x="560" y="176" fill="#d97a4a" font-size="12">  — заставить прямо сейчас</text>

  <!-- ФС и журнал -->
  <rect x="260" y="210" width="280" height="56" rx="8" fill="none" stroke="#6aa84f" stroke-width="2"/>
  <text x="272" y="232" fill="#6aa84f" font-weight="bold">ext4: сначала данные, потом</text>
  <text x="272" y="252" fill="#6aa84f" font-size="12">метаданные через журнал (data=ordered)</text>

  <line x1="400" y1="266" x2="400" y2="304" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- диск -->
  <rect x="260" y="310" width="280" height="36" rx="8" fill="#888" fill-opacity="0.15" stroke="#888" stroke-width="2"/>
  <text x="272" y="333" fill="#8a8a8a" font-weight="bold">/dev/sdb1 — теперь данные переживут выключение</text>

  <text x="580" y="240" fill="#8a8a8a" font-size="12">Между write() и диском —</text>
  <text x="580" y="256" fill="#8a8a8a" font-size="12">окно в десятки секунд.</text>
  <text x="580" y="272" fill="#8a8a8a" font-size="12">Выдернутый кабель</text>
  <text x="580" y="288" fill="#8a8a8a" font-size="12">попадает ровно в него.</text>
</svg>
