<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14171a"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c5fd6"/>
    </marker>
  </defs>

  <rect width="900" height="530" fill="#ffffff"/>
  <text x="40" y="38" font-size="17" font-weight="600" fill="#14171a">overlayfs: один каталог из нескольких</text>

  <!-- upper layer -->
  <rect x="40" y="72" width="380" height="92" fill="#eef3fd" stroke="#1c5fd6" stroke-width="1.2" rx="3"/>
  <text x="54" y="94" font-size="12" fill="#1c5fd6">upperdir — сюда идёт вся запись</text>
  <rect x="54" y="106" width="150" height="40" fill="#ffffff" stroke="#1c5fd6" rx="2"/>
  <text x="64" y="123" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">config.yml</text>
  <text x="64" y="138" font-size="10" fill="#1c5fd6">копия из base, v2</text>
  <rect x="224" y="106" width="150" height="40" fill="#ffffff" stroke="#b03030" stroke-dasharray="4 3" rx="2"/>
  <text x="234" y="123" font-size="12" fill="#626b78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">debug.log</text>
  <text x="234" y="138" font-size="10" fill="#b03030">whiteout, тип c 0,0</text>

  <!-- middle lower -->
  <rect x="40" y="184" width="380" height="92" fill="#f2f3f5" stroke="#c9ced6" stroke-width="1.2" rx="3"/>
  <text x="54" y="206" font-size="12" fill="#626b78">lowerdir — только чтение</text>
  <rect x="54" y="218" width="150" height="40" fill="#ffffff" stroke="#c9ced6" rx="2"/>
  <text x="64" y="243" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gallery</text>
  <rect x="224" y="218" width="150" height="40" fill="#ffffff" stroke="#c9ced6" rx="2"/>
  <text x="234" y="243" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">debug.log</text>

  <!-- bottom lower -->
  <rect x="40" y="296" width="380" height="92" fill="#f2f3f5" stroke="#c9ced6" stroke-width="1.2" rx="3"/>
  <text x="54" y="318" font-size="12" fill="#626b78">lowerdir — только чтение</text>
  <rect x="54" y="330" width="150" height="40" fill="#ffffff" stroke="#c9ced6" rx="2"/>
  <text x="64" y="347" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">config.yml</text>
  <text x="64" y="362" font-size="10" fill="#626b78">v1, не изменился</text>
  <rect x="224" y="330" width="150" height="40" fill="#ffffff" stroke="#c9ced6" rx="2"/>
  <text x="234" y="355" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">readme</text>

  <!-- copy-up curve -->
  <path d="M 48 348 C 6 338, 6 138, 48 128" fill="none" stroke="#1c5fd6" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <text x="24" y="243" font-size="11" fill="#1c5fd6" text-anchor="middle" transform="rotate(-90 24 243)">copy-up</text>

  <!-- merge arrow -->
  <line x1="428" y1="230" x2="510" y2="230" stroke="#14171a" stroke-width="1.4" marker-end="url(#a-ink)"/>
  <text x="469" y="220" font-size="11" fill="#626b78" text-anchor="middle">наложение</text>

  <!-- merged -->
  <rect x="520" y="72" width="340" height="316" fill="#ffffff" stroke="#14171a" stroke-width="1.6" rx="3"/>
  <text x="534" y="94" font-size="12" fill="#14171a">merged — то, что видит программа</text>

  <rect x="534" y="108" width="290" height="40" fill="#ffffff" stroke="#c9ced6" rx="2"/>
  <text x="546" y="125" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">config.yml</text>
  <text x="546" y="140" font-size="10" fill="#1c5fd6">v2 — победил upperdir</text>

  <rect x="534" y="156" width="290" height="40" fill="#ffffff" stroke="#c9ced6" rx="2"/>
  <text x="546" y="173" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gallery</text>
  <text x="546" y="188" font-size="10" fill="#626b78">из среднего слоя</text>

  <rect x="534" y="204" width="290" height="40" fill="#ffffff" stroke="#c9ced6" rx="2"/>
  <text x="546" y="221" font-size="12" fill="#14171a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">readme</text>
  <text x="546" y="236" font-size="10" fill="#626b78">из нижнего слоя</text>

  <rect x="534" y="252" width="290" height="40" fill="#fafafa" stroke="#e4e7eb" stroke-dasharray="4 3" rx="2"/>
  <text x="546" y="269" font-size="12" fill="#a3aab5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">debug.log</text>
  <line x1="546" y1="265" x2="616" y2="265" stroke="#b03030" stroke-width="1"/>
  <text x="546" y="284" font-size="10" fill="#b03030">скрыт whiteout'ом</text>

  <text x="534" y="330" font-size="11" fill="#626b78">Файл существует физически только в одном</text>
  <text x="534" y="346" font-size="11" fill="#626b78">из слоёв. merged ничего не хранит —</text>
  <text x="534" y="362" font-size="11" fill="#626b78">это правило поиска, а не копия.</text>

  <!-- legend -->
  <line x1="40" y1="408" x2="860" y2="408" stroke="#e4e7eb" stroke-width="1"/>
  <rect x="40" y="426" width="10" height="10" fill="#c9ced6"/>
  <text x="62" y="436" font-size="13" fill="#14171a">Чтение ищет имя сверху вниз и берёт первое найденное</text>
  <rect x="40" y="456" width="10" height="10" fill="#1c5fd6"/>
  <text x="62" y="466" font-size="13" fill="#14171a">Запись копирует файл целиком в upperdir — нижние слои не меняются</text>
  <rect x="40" y="486" width="10" height="10" fill="#b03030"/>
  <text x="62" y="496" font-size="13" fill="#14171a">Удаление кладёт в upperdir символьное устройство 0,0 — маркер дыры</text>
</svg>
