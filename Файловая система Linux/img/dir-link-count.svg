<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">Почему у каталога /srv/cats счётчик Links: 4</text>

  <!-- родитель -->
  <rect x="40" y="60" width="180" height="70" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="52" y="82" fill="#4a90d9" font-weight="bold">каталог /srv</text>
  <text x="52" y="102" fill="#8a8a8a" font-size="12">…</text>
  <text x="52" y="120" fill="#4a90d9" font-size="12">cats → 917505   (1)</text>

  <!-- сам каталог -->
  <rect x="310" y="60" width="180" height="70" rx="6" fill="#d97a4a" fill-opacity="0.15" stroke="#d97a4a" stroke-width="2"/>
  <text x="322" y="82" fill="#d97a4a" font-weight="bold">inode 917505</text>
  <text x="322" y="102" fill="#d97a4a" font-size="12">.   → 917505   (2)</text>
  <text x="322" y="120" fill="#8a8a8a" font-size="12">2023 → …,  2024 → …</text>

  <!-- дети -->
  <rect x="580" y="30" width="180" height="60" rx="6" fill="none" stroke="#6aa84f" stroke-width="2"/>
  <text x="592" y="52" fill="#6aa84f" font-weight="bold">каталог 2023</text>
  <text x="592" y="72" fill="#6aa84f" font-size="12">..  → 917505   (3)</text>

  <rect x="580" y="110" width="180" height="60" rx="6" fill="none" stroke="#6aa84f" stroke-width="2"/>
  <text x="592" y="132" fill="#6aa84f" font-weight="bold">каталог 2024</text>
  <text x="592" y="152" fill="#6aa84f" font-size="12">..  → 917505   (4)</text>

  <line x1="220" y1="116" x2="304" y2="100" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="580" y1="68" x2="496" y2="90" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="580" y1="148" x2="496" y2="110" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>

  <text x="40" y="215" fill="#8a8a8a" font-size="13">Имя в родителе + собственная «.» + по одной «..» из каждого подкаталога.</text>
  <text x="40" y="236" fill="#8a8a8a" font-size="13">Значит, число подкаталогов = Links − 2. Это единственные жёсткие ссылки на каталог,</text>
  <text x="40" y="257" fill="#8a8a8a" font-size="13">и создаёт их только ядро. Пользователю ln на каталог запрещён.</text>
</svg>
