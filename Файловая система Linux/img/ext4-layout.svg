<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">Раздел /dev/sdb1 глазами ext4</text>

  <!-- полоса раздела -->
  <rect x="40" y="50" width="720" height="50" rx="4" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <rect x="40" y="50" width="70" height="50" fill="#d97a4a" fill-opacity="0.3" stroke="#d97a4a"/>
  <text x="46" y="72" fill="#d97a4a" font-size="11">загрузочная</text>
  <text x="46" y="88" fill="#d97a4a" font-size="11">область, 1 КБ</text>
  <rect x="110" y="50" width="90" height="50" fill="#4a90d9" fill-opacity="0.3" stroke="#4a90d9"/>
  <text x="116" y="72" fill="#4a90d9" font-size="11">суперблок</text>
  <text x="116" y="88" fill="#4a90d9" font-size="11">+ дескрипторы</text>
  <rect x="200" y="50" width="110" height="50" fill="#6aa84f" fill-opacity="0.3" stroke="#6aa84f"/>
  <text x="206" y="72" fill="#6aa84f" font-size="11">журнал</text>
  <text x="206" y="88" fill="#6aa84f" font-size="11">(inode 8), ~512 МБ</text>
  <text x="330" y="80" fill="#8a8a8a" font-size="12">группа 0   группа 1   группа 2   …   группа 15 258   (по 128 МБ каждая)</text>

  <!-- увеличенная группа -->
  <line x1="450" y1="100" x2="120" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="530" y1="100" x2="760" y2="150" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="40" y="146" fill="#8a8a8a" font-size="12" font-weight="bold">одна группа блоков, 32 768 блоков по 4 КБ:</text>

  <rect x="120" y="156" width="80" height="50" fill="#4a90d9" fill-opacity="0.3" stroke="#4a90d9"/>
  <text x="126" y="178" fill="#4a90d9" font-size="11">копия супер-</text>
  <text x="126" y="194" fill="#4a90d9" font-size="11">блока (не везде)</text>
  <rect x="200" y="156" width="70" height="50" fill="#888" fill-opacity="0.25" stroke="#888"/>
  <text x="206" y="178" fill="#8a8a8a" font-size="11">битмап</text>
  <text x="206" y="194" fill="#8a8a8a" font-size="11">блоков</text>
  <rect x="270" y="156" width="70" height="50" fill="#888" fill-opacity="0.25" stroke="#888"/>
  <text x="276" y="178" fill="#8a8a8a" font-size="11">битмап</text>
  <text x="276" y="194" fill="#8a8a8a" font-size="11">inode</text>
  <rect x="340" y="156" width="110" height="50" fill="#d97a4a" fill-opacity="0.3" stroke="#d97a4a"/>
  <text x="346" y="178" fill="#d97a4a" font-size="11">таблица inode</text>
  <text x="346" y="194" fill="#d97a4a" font-size="11">по 256 байт</text>
  <rect x="450" y="156" width="310" height="50" fill="#6aa84f" fill-opacity="0.2" stroke="#6aa84f"/>
  <text x="456" y="178" fill="#6aa84f" font-size="11">блоки данных — файлы и каталоги</text>
  <text x="456" y="194" fill="#6aa84f" font-size="11">(ext4 старается класть файл в ту же группу, что и его inode)</text>

  <text x="40" y="240" fill="#8a8a8a" font-size="12">Суперблок: размер блока, число inode, свободные блоки, UUID, состояние «чисто/грязно». Читается mount и df.</text>
  <text x="40" y="260" fill="#8a8a8a" font-size="12">Журнал: кольцевой буфер, куда метаданные пишутся до того, как встать на место. После сбоя — проигрывается.</text>
  <text x="40" y="280" fill="#8a8a8a" font-size="12">Битмапы: по биту на блок и на inode — так ФС знает, что свободно, не сканируя всё.</text>
  <text x="40" y="308" fill="#d97a4a" font-size="12">Всё это и есть «метаданные». Их немного, но без них блоки данных — просто шум. Поэтому в журнале именно они.</text>
</svg>
