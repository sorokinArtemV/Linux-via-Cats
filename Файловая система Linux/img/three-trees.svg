<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">Три окна в ядро: что где искать</text>

  <!-- /proc -->
  <rect x="40" y="50" width="225" height="200" rx="8" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="52" y="74" fill="#4a90d9" font-size="15" font-weight="bold">/proc</text>
  <text x="52" y="94" fill="#8a8a8a" font-size="12">процессы и «старые» таблицы</text>
  <text x="52" y="120" fill="#8a8a8a" font-size="12">/proc/1842/status, fd/, cwd, exe</text>
  <text x="52" y="140" fill="#8a8a8a" font-size="12">/proc/cpuinfo, meminfo, loadavg</text>
  <text x="52" y="160" fill="#8a8a8a" font-size="12">/proc/mounts, /proc/devices</text>
  <text x="52" y="180" fill="#8a8a8a" font-size="12">/proc/sys/… — настройки (sysctl)</text>
  <text x="52" y="212" fill="#4a90d9" font-size="12">формат: текст в несколько строк,</text>
  <text x="52" y="230" fill="#4a90d9" font-size="12">как сложилось исторически</text>

  <!-- /sys -->
  <rect x="290" y="50" width="225" height="200" rx="8" fill="#6aa84f" fill-opacity="0.12" stroke="#6aa84f" stroke-width="2"/>
  <text x="302" y="74" fill="#6aa84f" font-size="15" font-weight="bold">/sys</text>
  <text x="302" y="94" fill="#8a8a8a" font-size="12">дерево объектов ядра</text>
  <text x="302" y="120" fill="#8a8a8a" font-size="12">/sys/block/sda/size</text>
  <text x="302" y="140" fill="#8a8a8a" font-size="12">/sys/block/sda/queue/rotational</text>
  <text x="302" y="160" fill="#8a8a8a" font-size="12">/sys/class/net/eth0/statistics/</text>
  <text x="302" y="180" fill="#8a8a8a" font-size="12">/sys/class/thermal/…/temp</text>
  <text x="302" y="212" fill="#6aa84f" font-size="12">формат: одно значение на файл,</text>
  <text x="302" y="230" fill="#6aa84f" font-size="12">строгая структура</text>

  <!-- /dev -->
  <rect x="540" y="50" width="225" height="200" rx="8" fill="#d97a4a" fill-opacity="0.12" stroke="#d97a4a" stroke-width="2"/>
  <text x="552" y="74" fill="#d97a4a" font-size="15" font-weight="bold">/dev</text>
  <text x="552" y="94" fill="#8a8a8a" font-size="12">сами устройства</text>
  <text x="552" y="120" fill="#8a8a8a" font-size="12">/dev/sda2 — читать/писать диск</text>
  <text x="552" y="140" fill="#8a8a8a" font-size="12">/dev/null, zero, urandom</text>
  <text x="552" y="160" fill="#8a8a8a" font-size="12">/dev/disk/by-uuid/ — стабильные</text>
  <text x="552" y="180" fill="#8a8a8a" font-size="12">имена (симлинки)</text>
  <text x="552" y="212" fill="#d97a4a" font-size="12">формат: сырые байты,</text>
  <text x="552" y="230" fill="#d97a4a" font-size="12">не описание, а доступ</text>

  <!-- стрелка sys -> dev -->
  <line x1="515" y1="270" x2="600" y2="270" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="300" y="286" fill="#8a8a8a" font-size="12">udev читает /sys и по нему создаёт файлы в /dev</text>

  <text x="40" y="322" fill="#8a8a8a" font-size="12">Ничего из этого нет на диске: содержимое собирается ядром в момент read(). Правило: описание — в /proc и /sys, доступ — в /dev.</text>
</svg>
