<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">Две оси FHS: делится ли между машинами × меняется ли в работе</text>

  <!-- подписи осей -->
  <text x="330" y="66" fill="#8a8a8a" font-size="13" font-weight="bold">статичное</text>
  <text x="290" y="84" fill="#8a8a8a" font-size="11">меняется только при установке/настройке</text>
  <text x="575" y="66" fill="#8a8a8a" font-size="13" font-weight="bold">изменяемое</text>
  <text x="560" y="84" fill="#8a8a8a" font-size="11">растёт и меняется в работе</text>

  <text x="40" y="160" fill="#8a8a8a" font-size="13" font-weight="bold">разделяемое</text>
  <text x="40" y="178" fill="#8a8a8a" font-size="11">одинаково на всех</text>
  <text x="40" y="194" fill="#8a8a8a" font-size="11">машинах, можно</text>
  <text x="40" y="210" fill="#8a8a8a" font-size="11">отдать по сети</text>

  <text x="40" y="300" fill="#8a8a8a" font-size="13" font-weight="bold">локальное</text>
  <text x="40" y="318" fill="#8a8a8a" font-size="11">своё у каждой</text>
  <text x="40" y="334" fill="#8a8a8a" font-size="11">машины</text>

  <!-- ячейки -->
  <rect x="200" y="100" width="280" height="130" rx="8" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="212" y="124" fill="#4a90d9" font-size="15" font-weight="bold">/usr   /opt</text>
  <text x="212" y="146" fill="#8a8a8a" font-size="12">сама ОС и программы:</text>
  <text x="212" y="164" fill="#8a8a8a" font-size="12">бинарники, библиотеки, документация</text>
  <text x="212" y="190" fill="#4a90d9" font-size="12">можно монтировать только для чтения</text>
  <text x="212" y="208" fill="#4a90d9" font-size="12">и раздавать сотне машин с одного NAS</text>

  <rect x="500" y="100" width="260" height="130" rx="8" fill="#6aa84f" fill-opacity="0.12" stroke="#6aa84f" stroke-width="2"/>
  <text x="512" y="124" fill="#6aa84f" font-size="15" font-weight="bold">/home   /srv   /var/mail</text>
  <text x="512" y="146" fill="#8a8a8a" font-size="12">данные людей и сервисов:</text>
  <text x="512" y="164" fill="#8a8a8a" font-size="12">коты, почта, сайты</text>
  <text x="512" y="190" fill="#6aa84f" font-size="12">меняются, но не привязаны</text>
  <text x="512" y="208" fill="#6aa84f" font-size="12">к конкретной машине</text>

  <rect x="200" y="250" width="280" height="130" rx="8" fill="#d97a4a" fill-opacity="0.12" stroke="#d97a4a" stroke-width="2"/>
  <text x="212" y="274" fill="#d97a4a" font-size="15" font-weight="bold">/etc   /boot</text>
  <text x="212" y="296" fill="#8a8a8a" font-size="12">настройки этой машины,</text>
  <text x="212" y="314" fill="#8a8a8a" font-size="12">её ядро и загрузчик</text>
  <text x="212" y="340" fill="#d97a4a" font-size="12">меняет только администратор,</text>
  <text x="212" y="358" fill="#d97a4a" font-size="12">но у каждой машины — свои</text>

  <rect x="500" y="250" width="260" height="130" rx="8" fill="#888" fill-opacity="0.12" stroke="#888" stroke-width="2"/>
  <text x="512" y="274" fill="#8a8a8a" font-size="15" font-weight="bold">/var/log  /var/lib  /run</text>
  <text x="512" y="296" fill="#8a8a8a" font-size="12">логи, состояние сервисов, pid-файлы,</text>
  <text x="512" y="314" fill="#8a8a8a" font-size="12">сокеты, кэши</text>
  <text x="512" y="340" fill="#8a8a8a" font-size="12">растут сами, только здесь.</text>
  <text x="512" y="358" fill="#8a8a8a" font-size="12">/run к тому же не переживает reboot</text>
</svg>
