<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- Шаг 1 -->
  <text x="30" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">1. Всё нормально</text>
  <rect x="30" y="44" width="200" height="32" rx="6" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="40" y="65" fill="#4a90d9" font-size="12">имя access.log в каталоге</text>
  <rect x="30" y="196" width="200" height="32" rx="6" fill="none" stroke="#6aa84f" stroke-width="2"/>
  <text x="40" y="217" fill="#6aa84f" font-size="12">процесс gallery, fd 5</text>
  <rect x="60" y="106" width="140" height="58" rx="6" fill="#d97a4a" fill-opacity="0.15" stroke="#d97a4a" stroke-width="2"/>
  <text x="72" y="128" fill="#d97a4a" font-weight="bold">inode 1310740</text>
  <text x="72" y="148" fill="#d97a4a" font-size="12">Links: 1, блоки: 20 ГБ</text>
  <line x1="130" y1="76" x2="130" y2="100" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="130" y1="196" x2="130" y2="170" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Шаг 2 -->
  <text x="300" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">2. После rm access.log</text>
  <rect x="300" y="44" width="200" height="32" rx="6" fill="none" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="310" y="65" fill="#8a8a8a" font-size="12">имени больше нет</text>
  <rect x="300" y="196" width="200" height="32" rx="6" fill="none" stroke="#6aa84f" stroke-width="2"/>
  <text x="310" y="217" fill="#6aa84f" font-size="12">процесс gallery, fd 5</text>
  <rect x="330" y="106" width="140" height="58" rx="6" fill="#d97a4a" fill-opacity="0.15" stroke="#d97a4a" stroke-width="2"/>
  <text x="342" y="128" fill="#d97a4a" font-weight="bold">inode 1310740</text>
  <text x="342" y="148" fill="#d97a4a" font-size="12">Links: 0, блоки: 20 ГБ</text>
  <line x1="400" y1="196" x2="400" y2="170" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="300" y="256" fill="#d97a4a" font-size="12">du не видит: имени нет.</text>
  <text x="300" y="274" fill="#d97a4a" font-size="12">df видит: блоки заняты.</text>

  <!-- Шаг 3 -->
  <text x="570" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">3. Процесс закрыл fd</text>
  <rect x="570" y="44" width="200" height="32" rx="6" fill="none" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="580" y="65" fill="#8a8a8a" font-size="12">имени нет</text>
  <rect x="570" y="196" width="200" height="32" rx="6" fill="none" stroke="#6aa84f" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="580" y="217" fill="#8a8a8a" font-size="12">дескриптора нет</text>
  <rect x="600" y="106" width="140" height="58" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="612" y="128" fill="#8a8a8a">inode освобождён</text>
  <text x="612" y="148" fill="#8a8a8a" font-size="12">блоки возвращены</text>
  <text x="570" y="256" fill="#6aa84f" font-size="12">Только теперь df показывает</text>
  <text x="570" y="274" fill="#6aa84f" font-size="12">свободное место.</text>

  <text x="30" y="312" fill="#8a8a8a" font-size="12">Файл живёт, пока на inode ссылается хотя бы одно имя ИЛИ хотя бы один открытый дескриптор.</text>
</svg>
