<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">Один -o без скобок: возраст проверяется только у одной половины</text>
  <text x="40" y="48" fill="#8a8a8a" font-size="12">find /srv/cats/thumbs -mtime +30 -name '*.jpg' -o -name '*.png' -delete</text>

  <text x="40" y="86" fill="#6aa84f" font-size="13" font-weight="bold">Что ты имел в виду</text>

  <rect x="40" y="98" width="210" height="46" rx="6" fill="#6aa84f" fill-opacity="0.12" stroke="#6aa84f" stroke-width="2"/>
  <text x="145" y="126" fill="#6aa84f" font-size="13" text-anchor="middle">имя *.jpg или *.png</text>
  <line x1="252" y1="121" x2="284" y2="121" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="292" y="98" width="170" height="46" rx="6" fill="#6aa84f" fill-opacity="0.12" stroke="#6aa84f" stroke-width="2"/>
  <text x="377" y="126" fill="#6aa84f" font-size="13" text-anchor="middle">старше 30 дней</text>
  <line x1="464" y1="121" x2="496" y2="121" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="504" y="98" width="130" height="46" rx="6" fill="#6aa84f" fill-opacity="0.12" stroke="#6aa84f" stroke-width="2"/>
  <text x="569" y="126" fill="#6aa84f" font-size="13" text-anchor="middle">-delete</text>

  <text x="40" y="186" fill="#d97a4a" font-size="13" font-weight="bold">Как это читает find</text>

  <rect x="40" y="198" width="170" height="46" rx="6" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="125" y="226" fill="#8a8a8a" font-size="13" text-anchor="middle">-mtime +30</text>
  <text x="222" y="226" fill="#8a8a8a" font-size="13">и</text>

  <rect x="248" y="198" width="170" height="46" rx="6" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="333" y="226" fill="#8a8a8a" font-size="13" text-anchor="middle">имя *.jpg</text>

  <text x="440" y="219" fill="#8a8a8a" font-size="12">истина → -o замыкается,</text>
  <text x="440" y="237" fill="#8a8a8a" font-size="12">правая часть не вычисляется, действия нет</text>

  <text x="40" y="274" fill="#8a8a8a" font-size="13" font-weight="bold">или</text>

  <rect x="40" y="288" width="170" height="46" rx="6" fill="#d97a4a" fill-opacity="0.12" stroke="#d97a4a" stroke-width="2"/>
  <text x="125" y="316" fill="#d97a4a" font-size="13" text-anchor="middle">имя *.png</text>
  <text x="222" y="316" fill="#8a8a8a" font-size="13">и</text>

  <rect x="248" y="288" width="170" height="46" rx="6" fill="#d97a4a" fill-opacity="0.12" stroke="#d97a4a" stroke-width="2"/>
  <text x="333" y="316" fill="#d97a4a" font-size="13" text-anchor="middle">-delete</text>

  <text x="440" y="309" fill="#d97a4a" font-size="12">удаляется любой png,</text>
  <text x="440" y="327" fill="#d97a4a" font-size="12">возраст не проверяется вовсе</text>

  <text x="40" y="372" fill="#8a8a8a" font-size="13">Невидимый -a связывает сильнее, чем -o. Итог: jpg не чистятся никогда, png сносятся все.</text>
</svg>
