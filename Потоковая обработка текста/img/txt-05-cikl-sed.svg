<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">Цикл sed: одна строка за оборот, скрипт применяется к каждой</text>

  <rect x="40" y="100" width="150" height="56" rx="6" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="115" y="124" fill="#4a90d9" font-weight="bold" text-anchor="middle">читает строку</text>
  <text x="115" y="143" fill="#8a8a8a" font-size="12" text-anchor="middle">из файла или stdin</text>

  <rect x="235" y="100" width="150" height="56" rx="6" fill="#d97a4a" fill-opacity="0.12" stroke="#d97a4a" stroke-width="2"/>
  <text x="310" y="124" fill="#d97a4a" font-weight="bold" text-anchor="middle">адрес совпал?</text>
  <text x="310" y="143" fill="#8a8a8a" font-size="12" text-anchor="middle">3, 100,200, $, /re/</text>

  <rect x="430" y="100" width="140" height="56" rx="6" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="500" y="124" fill="#4a90d9" font-weight="bold" text-anchor="middle">команда</text>
  <text x="500" y="143" fill="#8a8a8a" font-size="12" text-anchor="middle">s, d, p</text>

  <rect x="615" y="100" width="145" height="56" rx="6" fill="#6aa84f" fill-opacity="0.12" stroke="#6aa84f" stroke-width="2"/>
  <text x="687" y="124" fill="#6aa84f" font-weight="bold" text-anchor="middle">печатает</text>
  <text x="687" y="143" fill="#8a8a8a" font-size="12" text-anchor="middle">строку в stdout</text>

  <line x1="190" y1="128" x2="231" y2="128" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="385" y1="128" x2="426" y2="128" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="396" y="120" fill="#8a8a8a" font-size="12">да</text>
  <line x1="570" y1="128" x2="611" y2="128" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- нет: в обход команды -->
  <polyline points="310,100 310,66 687,66 687,96" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="60" fill="#8a8a8a" font-size="12">нет — строка идёт на печать без изменений</text>

  <!-- d: выбросить -->
  <line x1="500" y1="156" x2="500" y2="200" stroke="#d97a4a" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="508" y="184" fill="#d97a4a" font-size="12">d — выбросить, без печати</text>

  <!-- цикл -->
  <polyline points="687,156 687,200 115,200 115,160" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="250" y="219" fill="#8a8a8a" font-size="12">следующая строка — и всё сначала</text>

  <text x="40" y="262" fill="#8a8a8a" font-size="13">Без -n каждая строка печатается, изменённая или нет. С -n печати по умолчанию нет:</text>
  <text x="40" y="283" fill="#8a8a8a" font-size="13">на выходе только то, что явно напечатала команда p.</text>
</svg>
