<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">Один и тот же grep: строка уходит сразу или ждёт, пока наберётся блок</text>

  <!-- в терминал -->
  <text x="40" y="62" fill="#6aa84f" font-weight="bold">stdout — терминал: построчно</text>

  <rect x="40" y="76" width="130" height="56" rx="6" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="105" y="109" fill="#4a90d9" font-weight="bold" text-anchor="middle">grep</text>

  <rect x="230" y="76" width="250" height="56" rx="6" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="246" y="99" fill="#8a8a8a" font-size="12">буфер в памяти grep</text>
  <rect x="246" y="108" width="70" height="16" rx="3" fill="#6aa84f" fill-opacity="0.25" stroke="#6aa84f" stroke-width="1"/>
  <text x="330" y="121" fill="#8a8a8a" font-size="12">одна строка</text>

  <rect x="560" y="76" width="200" height="56" rx="6" fill="#6aa84f" fill-opacity="0.12" stroke="#6aa84f" stroke-width="2"/>
  <text x="660" y="101" fill="#6aa84f" font-weight="bold" text-anchor="middle">терминал</text>
  <text x="660" y="120" fill="#8a8a8a" font-size="12" text-anchor="middle">строка видна сразу</text>

  <line x1="170" y1="104" x2="226" y2="104" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="480" y1="104" x2="556" y2="104" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="490" y="96" fill="#8a8a8a" font-size="11">на «\n»</text>

  <!-- в pipe -->
  <text x="40" y="180" fill="#d97a4a" font-weight="bold">stdout — pipe или файл: блоками по 4 КБ</text>

  <rect x="40" y="194" width="130" height="56" rx="6" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="105" y="227" fill="#4a90d9" font-weight="bold" text-anchor="middle">grep</text>

  <rect x="230" y="194" width="250" height="56" rx="6" fill="none" stroke="#d97a4a" stroke-width="2"/>
  <text x="246" y="217" fill="#8a8a8a" font-size="12">буфер в памяти grep</text>
  <rect x="246" y="226" width="40" height="16" rx="3" fill="#d97a4a" fill-opacity="0.25" stroke="#d97a4a" stroke-width="1"/>
  <rect x="290" y="226" width="40" height="16" rx="3" fill="#d97a4a" fill-opacity="0.25" stroke="#d97a4a" stroke-width="1"/>
  <rect x="334" y="226" width="40" height="16" rx="3" fill="#d97a4a" fill-opacity="0.25" stroke="#d97a4a" stroke-width="1"/>
  <text x="384" y="239" fill="#8a8a8a" font-size="12">копятся…</text>

  <rect x="560" y="194" width="200" height="56" rx="6" fill="#d97a4a" fill-opacity="0.12" stroke="#d97a4a" stroke-width="2"/>
  <text x="660" y="219" fill="#d97a4a" font-weight="bold" text-anchor="middle">следующий grep</text>
  <text x="660" y="238" fill="#8a8a8a" font-size="12" text-anchor="middle">получает пачку разом</text>

  <line x1="170" y1="222" x2="226" y2="222" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="480" y1="222" x2="556" y2="222" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="490" y="214" fill="#8a8a8a" font-size="11">4 КБ</text>

  <text x="40" y="290" fill="#8a8a8a" font-size="13">Буфер живёт в памяти самой программы, а не в ядре. Пока он не полон, следующее звено</text>
  <text x="40" y="311" fill="#8a8a8a" font-size="13">конвейера ничего не получает. --line-buffered и stdbuf -oL возвращают построчный режим.</text>
</svg>
