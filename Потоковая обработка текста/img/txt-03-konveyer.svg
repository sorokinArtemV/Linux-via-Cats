<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">cut -d' ' -f1 access.log | sort | uniq -c — три процесса работают одновременно</text>

  <!-- процессы -->
  <rect x="40" y="70" width="130" height="70" rx="6" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="105" y="100" fill="#4a90d9" font-weight="bold" text-anchor="middle">cut</text>
  <text x="105" y="122" fill="#8a8a8a" font-size="12" text-anchor="middle">пишет в 1</text>

  <rect x="330" y="70" width="140" height="70" rx="6" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="400" y="100" fill="#4a90d9" font-weight="bold" text-anchor="middle">sort</text>
  <text x="400" y="122" fill="#8a8a8a" font-size="12" text-anchor="middle">читает 0, пишет в 1</text>

  <rect x="630" y="70" width="130" height="70" rx="6" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <text x="695" y="100" fill="#4a90d9" font-weight="bold" text-anchor="middle">uniq -c</text>
  <text x="695" y="122" fill="#8a8a8a" font-size="12" text-anchor="middle">читает 0</text>

  <!-- трубы -->
  <rect x="200" y="85" width="100" height="40" rx="6" fill="#d97a4a" fill-opacity="0.12" stroke="#d97a4a" stroke-width="2"/>
  <text x="250" y="104" fill="#d97a4a" font-weight="bold" text-anchor="middle">pipe</text>
  <text x="250" y="119" fill="#8a8a8a" font-size="11" text-anchor="middle">64 КБ в ядре</text>

  <rect x="500" y="85" width="100" height="40" rx="6" fill="#d97a4a" fill-opacity="0.12" stroke="#d97a4a" stroke-width="2"/>
  <text x="550" y="104" fill="#d97a4a" font-weight="bold" text-anchor="middle">pipe</text>
  <text x="550" y="119" fill="#8a8a8a" font-size="11" text-anchor="middle">64 КБ в ядре</text>

  <line x1="170" y1="105" x2="196" y2="105" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="300" y1="105" x2="326" y2="105" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="105" x2="496" y2="105" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="600" y1="105" x2="626" y2="105" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- правила -->
  <rect x="40" y="170" width="345" height="70" rx="6" fill="none" stroke="#d97a4a" stroke-width="2"/>
  <text x="56" y="196" fill="#d97a4a" font-weight="bold">буфер полон</text>
  <text x="56" y="220" fill="#8a8a8a">писатель засыпает, пока читатель не заберёт</text>

  <rect x="415" y="170" width="345" height="70" rx="6" fill="none" stroke="#d97a4a" stroke-width="2"/>
  <text x="431" y="196" fill="#d97a4a" font-weight="bold">буфер пуст</text>
  <text x="431" y="220" fill="#8a8a8a">читатель засыпает, пока писатель не положит</text>

  <text x="40" y="276" fill="#8a8a8a" font-size="13">Конец данных читатель видит, когда все пишущие концы трубы закрыты.</text>
  <text x="40" y="297" fill="#8a8a8a" font-size="13">Временного файла нет: всё, что «в пути», — не больше 64 КБ на каждую трубу.</text>
</svg>
