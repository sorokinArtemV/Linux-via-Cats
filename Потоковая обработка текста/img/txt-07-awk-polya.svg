<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="sans-serif" font-size="13">
<text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">Поля awk: пробел внутри кавычек — тоже разделитель</text>
<text x="40" y="58" fill="#8a8a8a" font-size="12">запрос от curl: user-agent из одного слова, время ответа — $10</text>
<rect x="40" y="92" width="123" height="28" rx="5" fill="none" stroke="#8a8a8a" stroke-width="2"/>
<text x="101" y="110" fill="#8a8a8a" font-family="monospace" font-size="10" text-anchor="middle">10.0.0.14 - - […]</text>
<text x="101" y="86" fill="#8a8a8a" font-size="12" font-weight="bold" text-anchor="middle">$1…$4</text>
<rect x="168" y="92" width="40" height="28" rx="5" fill="none" stroke="#8a8a8a" stroke-width="2"/>
<text x="188" y="110" fill="#8a8a8a" font-family="monospace" font-size="10" text-anchor="middle">"GET</text>
<text x="188" y="86" fill="#8a8a8a" font-size="12" font-weight="bold" text-anchor="middle">$5</text>
<rect x="212" y="92" width="97" height="28" rx="5" fill="none" stroke="#8a8a8a" stroke-width="2"/>
<text x="261" y="110" fill="#8a8a8a" font-family="monospace" font-size="10" text-anchor="middle">/healthcheck"</text>
<text x="261" y="86" fill="#8a8a8a" font-size="12" font-weight="bold" text-anchor="middle">$6</text>
<rect x="315" y="92" width="33" height="28" rx="5" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
<text x="331" y="110" fill="#4a90d9" font-family="monospace" font-size="10" text-anchor="middle">200</text>
<text x="331" y="86" fill="#4a90d9" font-size="12" font-weight="bold" text-anchor="middle">$7</text>
<rect x="353" y="92" width="27" height="28" rx="5" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
<text x="366" y="110" fill="#4a90d9" font-family="monospace" font-size="10" text-anchor="middle">21</text>
<text x="366" y="86" fill="#4a90d9" font-size="12" font-weight="bold" text-anchor="middle">$8</text>
<rect x="385" y="92" width="91" height="28" rx="5" fill="none" stroke="#8a8a8a" stroke-width="2"/>
<text x="430" y="110" fill="#8a8a8a" font-family="monospace" font-size="10" text-anchor="middle">"curl/8.5.0"</text>
<text x="430" y="86" fill="#8a8a8a" font-size="12" font-weight="bold" text-anchor="middle">$9</text>
<rect x="480" y="92" width="46" height="28" rx="5" fill="#6aa84f" fill-opacity="0.12" stroke="#6aa84f" stroke-width="2"/>
<text x="503" y="110" fill="#6aa84f" font-family="monospace" font-size="10" text-anchor="middle">0.002</text>
<text x="503" y="86" fill="#6aa84f" font-size="12" font-weight="bold" text-anchor="middle">$10</text>
<text x="40" y="148" fill="#8a8a8a" font-size="12">запрос от браузера: в user-agent три пробела, время уехало в $13, а $10 — кусок user-agent</text>
<rect x="40" y="182" width="123" height="28" rx="5" fill="none" stroke="#8a8a8a" stroke-width="2"/>
<text x="101" y="200" fill="#8a8a8a" font-family="monospace" font-size="10" text-anchor="middle">10.0.0.22 - - […]</text>
<text x="101" y="176" fill="#8a8a8a" font-size="12" font-weight="bold" text-anchor="middle">$1…$4</text>
<rect x="168" y="182" width="40" height="28" rx="5" fill="none" stroke="#8a8a8a" stroke-width="2"/>
<text x="188" y="200" fill="#8a8a8a" font-family="monospace" font-size="10" text-anchor="middle">"GET</text>
<text x="188" y="176" fill="#8a8a8a" font-size="12" font-weight="bold" text-anchor="middle">$5</text>
<rect x="212" y="182" width="123" height="28" rx="5" fill="none" stroke="#8a8a8a" stroke-width="2"/>
<text x="274" y="200" fill="#8a8a8a" font-family="monospace" font-size="10" text-anchor="middle">/cats/barsik.jpg"</text>
<text x="274" y="176" fill="#8a8a8a" font-size="12" font-weight="bold" text-anchor="middle">$6</text>
<rect x="340" y="182" width="33" height="28" rx="5" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
<text x="357" y="200" fill="#4a90d9" font-family="monospace" font-size="10" text-anchor="middle">200</text>
<text x="357" y="176" fill="#4a90d9" font-size="12" font-weight="bold" text-anchor="middle">$7</text>
<rect x="378" y="182" width="59" height="28" rx="5" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
<text x="408" y="200" fill="#4a90d9" font-family="monospace" font-size="10" text-anchor="middle">2413556</text>
<text x="408" y="176" fill="#4a90d9" font-size="12" font-weight="bold" text-anchor="middle">$8</text>
<rect x="442" y="182" width="91" height="28" rx="5" fill="none" stroke="#8a8a8a" stroke-width="2"/>
<text x="488" y="200" fill="#8a8a8a" font-family="monospace" font-size="10" text-anchor="middle">"Mozilla/5.0</text>
<text x="488" y="176" fill="#8a8a8a" font-size="12" font-weight="bold" text-anchor="middle">$9</text>
<rect x="538" y="182" width="46" height="28" rx="5" fill="#d97a4a" fill-opacity="0.12" stroke="#d97a4a" stroke-width="2"/>
<text x="561" y="200" fill="#d97a4a" font-family="monospace" font-size="10" text-anchor="middle">(X11;</text>
<text x="561" y="176" fill="#d97a4a" font-size="12" font-weight="bold" text-anchor="middle">$10</text>
<rect x="589" y="182" width="46" height="28" rx="5" fill="none" stroke="#8a8a8a" stroke-width="2"/>
<text x="612" y="200" fill="#8a8a8a" font-family="monospace" font-size="10" text-anchor="middle">Linux</text>
<text x="612" y="176" fill="#8a8a8a" font-size="12" font-weight="bold" text-anchor="middle">$11</text>
<rect x="640" y="182" width="65" height="28" rx="5" fill="none" stroke="#8a8a8a" stroke-width="2"/>
<text x="673" y="200" fill="#8a8a8a" font-family="monospace" font-size="10" text-anchor="middle">x86_64)"</text>
<text x="673" y="176" fill="#8a8a8a" font-size="12" font-weight="bold" text-anchor="middle">$12</text>
<rect x="710" y="182" width="46" height="28" rx="5" fill="#6aa84f" fill-opacity="0.12" stroke="#6aa84f" stroke-width="2"/>
<text x="733" y="200" fill="#6aa84f" font-family="monospace" font-size="10" text-anchor="middle">0.931</text>
<text x="733" y="176" fill="#6aa84f" font-size="12" font-weight="bold" text-anchor="middle">$13</text>
<text x="40" y="252" fill="#8a8a8a" font-size="13">$7 и $8 стоят левее user-agent и не сдвигаются. Всё, что правее, меняет номер от строки к строке.</text>
<text x="40" y="273" fill="#8a8a8a" font-size="13">Последнее поле всегда доступно как $NF, а разбиение по кавычкам даёт -F'"'.</text>
</svg>
