<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="40" y="26" fill="#8a8a8a" font-size="14" font-weight="bold">awk '{count[$1]++} END {…}': строки проходят, в памяти остаётся таблица</text>

  <!-- поток строк -->
  <text x="40" y="62" fill="#4a90d9" font-weight="bold">поток строк</text>
  <rect x="40" y="74" width="170" height="26" rx="5" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="50" y="92" fill="#8a8a8a" font-family="monospace" font-size="11">10.0.0.14 - - …</text>
  <rect x="40" y="106" width="170" height="26" rx="5" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="50" y="124" fill="#8a8a8a" font-family="monospace" font-size="11">10.0.0.22 - - …</text>
  <rect x="40" y="138" width="170" height="26" rx="5" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="50" y="156" fill="#8a8a8a" font-family="monospace" font-size="11">10.0.0.14 - - …</text>
  <rect x="40" y="170" width="170" height="26" rx="5" fill="none" stroke="#4a90d9" stroke-width="2"/>
  <text x="50" y="188" fill="#8a8a8a" font-family="monospace" font-size="11">192.168.1.37 - - …</text>
  <text x="125" y="214" fill="#8a8a8a" font-size="12" text-anchor="middle">… 48 213 строк</text>

  <!-- действие -->
  <rect x="260" y="104" width="150" height="62" rx="6" fill="#d97a4a" fill-opacity="0.12" stroke="#d97a4a" stroke-width="2"/>
  <text x="335" y="130" fill="#d97a4a" font-family="monospace" font-weight="bold" text-anchor="middle">count[$1]++</text>
  <text x="335" y="151" fill="#8a8a8a" font-size="12" text-anchor="middle">для каждой строки</text>

  <!-- таблица -->
  <text x="460" y="62" fill="#4a90d9" font-weight="bold">таблица в памяти awk</text>
  <rect x="460" y="74" width="150" height="122" rx="6" fill="#4a90d9" fill-opacity="0.12" stroke="#4a90d9" stroke-width="2"/>
  <line x1="460" y1="104" x2="610" y2="104" stroke="#4a90d9" stroke-width="1"/>
  <text x="472" y="94" fill="#4a90d9" font-size="12" font-weight="bold">ключ</text>
  <text x="598" y="94" fill="#4a90d9" font-size="12" font-weight="bold" text-anchor="end">счётчик</text>
  <text x="472" y="124" fill="#8a8a8a" font-family="monospace" font-size="11">10.0.0.14</text>
  <text x="598" y="124" fill="#8a8a8a" font-family="monospace" font-size="11" text-anchor="end">12407</text>
  <text x="472" y="148" fill="#8a8a8a" font-family="monospace" font-size="11">192.168.1.37</text>
  <text x="598" y="148" fill="#8a8a8a" font-family="monospace" font-size="11" text-anchor="end">8311</text>
  <text x="472" y="172" fill="#8a8a8a" font-family="monospace" font-size="11">10.0.0.22</text>
  <text x="598" y="172" fill="#8a8a8a" font-family="monospace" font-size="11" text-anchor="end">5170</text>
  <text x="472" y="190" fill="#8a8a8a" font-size="11">…</text>

  <!-- END -->
  <rect x="650" y="104" width="110" height="62" rx="6" fill="#6aa84f" fill-opacity="0.12" stroke="#6aa84f" stroke-width="2"/>
  <text x="705" y="130" fill="#6aa84f" font-weight="bold" text-anchor="middle">END</text>
  <text x="705" y="151" fill="#8a8a8a" font-size="12" text-anchor="middle">печать таблицы</text>

  <line x1="210" y1="135" x2="256" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="410" y1="135" x2="456" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="610" y1="135" x2="646" y2="135" stroke="#8a8a8a" stroke-width="2" marker-end="url(#arr)"/>

  <text x="40" y="262" fill="#8a8a8a" font-size="13">Сами строки не хранятся: в памяти по одной записи на каждый разный ключ.</text>
  <text x="40" y="283" fill="#8a8a8a" font-size="13">Порядок обхода for (k in a) не определён, поэтому после END результат отдают в sort.</text>
</svg>
